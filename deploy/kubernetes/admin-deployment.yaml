apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: emme/admin-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-service
spec:
  selector:
    app.kubernetes.io/name: admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
