---
name: Real full-stack E2E recordings

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      service_ref:
        description: >-
          Emme service commit, branch, or tag already deployed at
          service_base_url
        required: true
        default: 'feat/enterprise-module-template-conformance'
        type: string
      web_ref:
        description: 'Emme web commit, branch, or tag to record'
        required: true
        default: 'feat/api-version-contract'
        type: string
      service_base_url:
        description: >-
          Reachable Emme service URL with deterministic E2E tenant data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: real-e2e-recordings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    name: Record tenant-owner full-stack journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_MODE: real
      RECORD_DEMO: 'true'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: ${{ inputs.service_base_url }}
      E2E_KEYCLOAK_USERNAME: ${{ secrets.E2E_KEYCLOAK_USERNAME }}
      E2E_KEYCLOAK_PASSWORD: ${{ secrets.E2E_KEYCLOAK_PASSWORD }}

    steps:
      - name: Check out web ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.web_ref }}
          persist-credentials: false

      - name: Check out service ref for traceability
        uses: actions/checkout@v4
        with:
          repository: migangdelzar/emme-service
          ref: ${{ inputs.service_ref }}
          path: .ci/emme-service
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Validate required runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_API_URL}" || {
            echo 'service_base_url is required'
            exit 1
          }
          test -n "${E2E_KEYCLOAK_USERNAME}" || {
            echo 'E2E_KEYCLOAK_USERNAME secret is required'
            exit 1
          }
          test -n "${E2E_KEYCLOAK_PASSWORD}" || {
            echo 'E2E_KEYCLOAK_PASSWORD secret is required'
            exit 1
          }
          test -f .ci/emme-service/applications/emme-platform/build.gradle.kts

      - name: Run real full-stack recordings
        run: bun run --filter @emme/e2e test:real:recordings

      - name: Upload real videos and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emme-web-real-e2e-recordings-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            e2e/src/test-results/real-recordings
            e2e/src/playwright-report
            e2e/src/test-results.json
