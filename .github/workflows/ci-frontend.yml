---
name: Frontend and full-stack CI

run-name: >-
  Frontend + full-stack CI · target=${{ inputs.deployment_target || 'compose' }} ·
  runtime=${{ inputs.runtime || 'jvm' }}

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_mock_e2e:
        description: Run mock browser flows
        required: true
        default: true
        type: boolean
      run_security:
        description: Run the dependency vulnerability audit
        required: true
        default: true
        type: boolean
      run_real_e2e:
        description: Run real provider full-stack regression or recordings
        required: true
        default: true
        type: boolean
      e2e_suite:
        description: Real full-stack suite
        required: true
        default: regression
        type: choice
        options:
          - regression
          - recordings
      deployment_target:
        description: Full-stack deployment target
        required: true
        default: compose
        type: choice
        options:
          - compose
          - k3d
          - k3s
      runtime:
        description: Service runtime for full-stack execution
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
      service_ref:
        description: Service branch, tag, or commit for full-stack execution
        required: true
        default: feat/enterprise-module-template-conformance
        type: string
      web_ref:
        description: Web branch, tag, or commit for full-stack execution
        required: false
        default: ''
        type: string
      service_base_url:
        description: Existing service URL for k3d/k3s
        required: false
        default: ''
        type: string
      web_base_url:
        description: Existing web URL for k3d/k3s
        required: false
        default: ''
        type: string
      e2e_owner_username:
        description: Disposable tenant-owner username/email
        required: true
        default: e2e-owner@emme.app
        type: string
      k3s_environment:
        description: Protected environment for a k3s target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up web workspace
        uses: ./.github/actions/setup-bun

      - name: Verify documentation
        run: bun run docs:check

      - name: Verify internationalization boundary
        run: bun run i18n:check

      - name: Verify formatting
        run: bun run format:check

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint
        run: bun run --filter '*' lint

      - name: Unit tests
        run: bun run test

      - name: Coverage gate
        run: bun run test:coverage

      - name: Build
        run: bun run --filter '*' build

      - name: Install Chromium for mock E2E
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_mock_e2e == true
        run: cd e2e/src && bunx playwright install --with-deps chromium

      - name: Mock critical browser flows
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_mock_e2e == true
        run: bun run test:e2e:mock

      - name: Dependency vulnerability audit
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_security == true
        run: bun run security:check

  real-e2e:
    name: Real full-stack E2E
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_real_e2e == true)
    uses: ./.github/workflows/real-e2e-recordings.yml
    with:
      service_ref: ${{ inputs.service_ref || 'feat/enterprise-module-template-conformance' }}
      web_ref: ${{ inputs.web_ref || github.sha }}
      e2e_owner_username: ${{ inputs.e2e_owner_username || 'e2e-owner@emme.app' }}
      suite: ${{ inputs.e2e_suite || 'regression' }}
      deployment_target: ${{ inputs.deployment_target || 'compose' }}
      runtime: ${{ inputs.runtime || 'jvm' }}
      service_base_url: ${{ inputs.service_base_url || '' }}
      web_base_url: ${{ inputs.web_base_url || '' }}
      k3s_environment: ${{ inputs.k3s_environment || 'staging' }}
    secrets: inherit
