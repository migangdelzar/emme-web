---
name: Frontend CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_mock_e2e:
        description: Run mock browser flows
        required: true
        default: true
        type: boolean
      run_security:
        description: Run the dependency vulnerability audit
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up web workspace
        uses: ./.github/actions/setup-bun

      - name: Verify documentation
        run: bun run docs:check

      - name: Verify internationalization boundary
        run: bun run i18n:check

      - name: Verify formatting
        run: bun run format:check

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint
        run: bun run --filter '*' lint

      - name: Unit tests
        run: bun run test

      - name: Coverage gate
        run: bun run test:coverage

      - name: Build
        run: bun run --filter '*' build

      - name: Install Chromium for mock E2E
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_mock_e2e == true
        run: cd e2e/src && bunx playwright install --with-deps chromium

      - name: Mock critical browser flows
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_mock_e2e == true
        run: bun run test:e2e:mock

      - name: Dependency vulnerability audit
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_security == true
        run: bun run security:check
