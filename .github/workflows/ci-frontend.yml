---
name: Frontend CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify documentation
        run: bun run docs:check

      - name: Verify internationalization boundary
        run: bun run i18n:check

      - name: Verify formatting
        run: bun run format:check

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint
        run: bun run --filter '*' lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run --filter '*' build

      - name: Install Chromium for mock E2E
        run: bunx playwright install --with-deps chromium

      - name: Mock critical browser flows
        run: bun run test:e2e:mock

      - name: Dependency vulnerability audit
        run: bun run security:check
