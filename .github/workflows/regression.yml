---
name: Full-stack regression

run-name: >-
  Regression · target=${{ inputs.deployment_target || 'compose' }} ·
  runtime=${{ inputs.runtime || 'jvm' }}

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_e2e:
        description: Run the real full-stack regression suite
        required: true
        default: true
        type: boolean
      deployment_target:
        description: Provisioned runtime target; Compose is the default
        required: true
        default: compose
        type: choice
        options:
          - compose
          - k3d
          - k3s
      runtime:
        description: Service runtime
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
      service_ref:
        description: Emme service branch, tag, or commit
        required: true
        default: feat/enterprise-module-template-conformance
        type: string
      web_ref:
        description: Emme web branch, tag, or commit
        required: true
        default: feat/api-version-contract
        type: string
      service_base_url:
        description: Existing service URL for k3d/k3s targets
        required: false
        default: ''
        type: string
      web_base_url:
        description: Existing web URL for k3d/k3s targets
        required: false
        default: ''
        type: string
      e2e_owner_username:
        description: Disposable tenant-owner username/email
        required: true
        default: e2e-owner@emme.app
        type: string
      k3s_environment:
        description: Protected environment for a k3s target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-e2e:
    name: Mock provider E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up web workspace
        uses: ./.github/actions/setup-bun
      - name: Install Chromium
        working-directory: e2e/src
        run: bunx playwright install --with-deps chromium
      - name: Run mock E2E suite
        run: bun run test:e2e:mock
      - name: Upload mock diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: emme-mock-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            e2e/src/playwright-report
            e2e/src/test-results.json

  real-e2e:
    name: Real provider E2E
    if: >-
      github.event_name != 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_real_e2e == true)
    uses: ./.github/workflows/real-e2e-recordings.yml
    with:
      service_ref: >-
        ${{ inputs.service_ref ||
        'feat/enterprise-module-template-conformance' }}
      web_ref: ${{ inputs.web_ref || github.sha }}
      e2e_owner_username: >-
        ${{ inputs.e2e_owner_username || 'e2e-owner@emme.app' }}
      suite: regression
      deployment_target: ${{ inputs.deployment_target || 'compose' }}
      runtime: ${{ inputs.runtime || 'jvm' }}
      service_base_url: ${{ inputs.service_base_url || '' }}
      web_base_url: ${{ inputs.web_base_url || '' }}
      k3s_environment: ${{ inputs.k3s_environment || 'staging' }}
    secrets: inherit
