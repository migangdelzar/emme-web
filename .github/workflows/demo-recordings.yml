---
name: Mock E2E demo flows

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-e2e-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Run deterministic mock flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up web workspace
        uses: ./.github/actions/setup-bun

      - name: Install Chromium
        run: cd e2e/src && bunx playwright install --with-deps chromium

      - name: Run mock-mode flows without recording videos
        run: bun run --filter @emme/e2e test:demo

      - name: Upload mock diagnostics and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emme-web-mock-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            e2e/src/playwright-report
            e2e/src/test-results.json
