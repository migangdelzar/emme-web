name: Playwright demo recordings

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-recordings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record deterministic frontend flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: cd e2e/src && bunx playwright install --with-deps chromium

      - name: Record mock-mode flows
        run: bun run --filter @emme/e2e test:demo

      - name: Upload demo videos and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emme-web-demo-recordings-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            e2e/src/test-results
            e2e/src/playwright-report
            e2e/src/test-results.json
