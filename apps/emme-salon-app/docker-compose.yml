# ─── Emme Salon — Docker Compose (dev) ───
services:
  emme-salon:
    build:
      context: ../..
      dockerfile: apps/emme-salon-app/Dockerfile
    ports:
      - "8080:80"
    environment:
      EMME_API_UPSTREAM: host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
