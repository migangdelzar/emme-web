[tools]
bun = "1.2"

[tasks.install]
description = "Install the locked web workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the salon web application"
run = "bun run dev"

[tasks.typecheck]
description = "Type-check all web workspace packages"
run = "bun run typecheck"

[tasks.docs-check]
description = "Validate Markdown links and code fences"
run = "bun run docs:check"

[tasks.lint]
description = "Lint all frontend packages"
run = "bun run lint"

[tasks.test]
description = "Run frontend unit and component tests"
run = "bun run test"

[tasks.test-e2e]
description = "Run Playwright journeys; requires the sibling backend for real mode"
run = "bun run test:e2e"

[tasks.security-check]
description = "Audit frontend dependencies for high and critical vulnerabilities"
run = "bun run security:check"

[tasks.quality]
description = "Run documentation, lint, type, test, build, and security gates"
run = "bun run quality"

[tasks.build]
description = "Build all web workspace packages"
run = "bun run build"
